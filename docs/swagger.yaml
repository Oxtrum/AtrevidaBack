          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token ausente o invalido
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Reserva no encontrada
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Reserva completada, sin espacios disponibles en el horario
            destino o, al pasar a AGENDADO con descuento al agendar y stock negativo
            no permitido, stock insuficiente de insumos
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Actualizar reserva en base de datos
      tags:
      - Reservas BD
    post:
      consumes:
      - application/json
      description: |-
        Crea una reserva en PostgreSQL. local: nombre del local (requerido). fecha: YYYY-MM-DD (requerido, no acepta domingos). hora_desde: HH:MM (requerido). hora_hasta: HH:MM (opcional). Horarios: lunes a viernes 08:00-20:00; sabado SAN MARTIN 08:00-15:00 y PASEO ARANJUEZ 08:00-18:00. tipo: M=mesa o B=bicicleta (opcional). cliente: nombre del cliente (requerido). numero_telefono: telefono del cliente (requerido). estado: PENDIENTE por defecto, AGENDADO (opcional). servicio_id: ID del servicio en BD, recomendado para aplicar requiere_evaluacion sin depender del nombre (opcional). servicio: nombre del servicio principal (opcional). servicio_solicitado: detalle solicitado, se copia de servicio si se omite (opcional). servicio_confirmado: servicio final tras evaluacion, se autocompleta si no requiere evaluacion (opcional). precio: precio de la reserva (opcional). notas: observaciones (opcional). plan_id: ID del plan asociado (opcional).
        costo_variable se deriva del catalogo y se conserva como dato historico; no se acepta desde el cliente. En servicios variables, precio es opcional y representa un importe acordado, no el costo de referencia.
        Inventario: si la peticion trae token Bearer valido (panel interno) y el servicio tiene insumos sin stock suficiente en el local, la reserva se guarda igual y la respuesta incluye alerta_inventario y advertencias_inventario; con la politica inventario.politica_sin_stock=BLOQUEAR responde 409 con el texto stock insuficiente. El formulario publico (sin token) nunca recibe advertencias ni se bloquea.
      parameters:
      - description: Datos de la reserva
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.crearReservaPGRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.reservaCreatedResponse'
              type: object
        "400":
          description: 'Error de validacion: campo requerido faltante, estado invalido,
            servicio requiere evaluacion, formato incorrecto u horario fuera de atencion'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: 'Conflicto: no hay espacios disponibles, el horario no esta
            libre o stock insuficiente de insumos con politica BLOQUEAR'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Crear reserva en base de datos
      tags:
      - Reservas BD
