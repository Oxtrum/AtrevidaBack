          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Eliminar servicio
      tags:
      - Servicios BD
    get:
      description: |-
        Incluye costo_variable; true indica que el costo se define al cobrar y costo es cero por compatibilidad.
        Devuelve un servicio por su ID. Param: id (requerido, path). Response: servicio (ServicioItem con: id, nombre, categoria, local, tiempo HH:MM, costo, sesiones, tipoEspacio M/B, requiere_evaluacion).
      parameters:
      - description: ID del servicio
        example: 8
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.servicioItemResponse'
              type: object
        "400":
          description: 'Error de validacion: id invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Servicio no encontrado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Obtener servicio por ID
      tags:
      - Servicios BD
    patch:
      consumes:
      - application/json
      description: |-
        Omitir costo_variable conserva la modalidad actual. Una modalidad variable siempre guarda costo cero incluso en requests antiguos. Pasar de variable a fijo exige enviar costo explicitamente (cero es valido). El costo recibido debe ser finito, no negativo y no superar 99999999.99; se redondea a dos decimales.
        Actualiza un servicio existente. Solo se actualizan los campos enviados. Si se cambia categoria y el servicio ya esta asociado a locales, la nueva categoria se asocia automaticamente a esos locales en categorias_locales dentro de la misma transaccion. Param: id (requerido, path). Body: nombre (opcional), categoria (opcional), tiempo HH:MM (opcional), costo (opcional), sesiones (opcional), tipo_espacio_requerido M/B (opcional), requiere_evaluacion true/false (opcional), activo true/false (opcional). Response: mensaje string.
      parameters:
      - description: ID del servicio
        example: 8
        in: path
        name: id
        required: true
        type: integer
      - description: Campos a actualizar (todos opcionales, al menos uno requerido)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.actualizarServicioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.messageResponse'
              type: object
        "400":
          description: 'Error de validacion: id invalido, costo invalido o ausente
            al pasar de variable a fijo, categoria no disponible, tipo_espacio_requerido
            invalido o sin campos a modificar'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Servicio no encontrado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Actualizar servicio
      tags:
      - Servicios BD
