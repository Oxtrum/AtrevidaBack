  /bd/reservas/resumen:
    get:
      description: 'Devuelve resumen de reservas del dia y pagos del periodo. Requiere
        token Bearer. Los usuarios con local asignado solo consultan su local desde
        el token; si el token no tiene local, puede filtrar por el query local o consultar
        todos si no lo envia. Param: fecha YYYY-MM-DD (requerido, query). Si fecha
        es domingo, los indicadores diarios se devuelven en cero porque no hay atencion;
        el resumen semanal se calcula de lunes a sabado anterior. Los pagos consideran
        registros activos con estado PAGADO en la tabla pagos, usando el mismo filtro
        de local y rango lunes-fecha. Response: reservas_agendadas_dia (int), servicios_completados_dia
        (int), ingresos_hoy (number), cancelaciones_hoy (int), ingresos_semana (number),
        semana (reservaResumenSemanaResponse con: total_reservas int, lunes..sabado
        int opcionales segun el dia efectivo), ingresos (reservaResumenIngresosSemanaResponse
        con: total_ingresos number, lunes..sabado number opcionales segun el dia efectivo).'
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Fecha a consultar YYYY-MM-DD; si es domingo los indicadores diarios
          son cero y la semana termina el sabado anterior
        example: "2026-05-24"
        in: query
        name: fecha
        required: true
        type: string
      - description: Nombre exacto del local a consultar cuando el token no tiene
          local; si se omite, consulta todos los locales
        example: SAN MARTIN
        in: query
        name: local
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.reservaResumenResponse'
              type: object
        "400":
          description: 'Error de validacion: fecha requerida o formato invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token requerido, invalido o expirado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Usuario no autorizado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Local no encontrado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Obtener resumen numerico de reservas
      tags:
      - Reservas BD
  /bd/servicios:
    get:
      description: |-
        Cada servicio incluye costo_variable. Cuando es true, costo es cero por compatibilidad y no representa un servicio gratuito.
        Devuelve servicios desde PostgreSQL con filtros. Filtros: nombre busqueda parcial (opcional), categoria busqueda parcial (opcional), local SAN MARTIN/PASEO ARANJUEZ (opcional), sesiones numero exacto (opcional), requiere_evaluacion true/false (opcional), paciente_nuevo true/false (opcional) filtrar solo servicios visibles para nuevos pacientes. Response: total (int), filtros (objeto con nombre, categoria, local, sesiones, requiere_evaluacion, paciente_nuevo), servicios ([]ServicioItem con: id, nombre, categoria, local, tiempo HH:MM, costo, sesiones, tipoEspacio M/B, requiere_evaluacion, visible_paciente_nuevo).
      parameters:
      - description: Busqueda parcial por nombre
        example: depila
        in: query
        name: nombre
        type: string
      - description: Busqueda parcial por categoria
        example: Corporal
        in: query
        name: categoria
        type: string
      - description: Local
        example: SAN MARTIN
        in: query
        name: local
        type: string
      - description: Numero exacto de sesiones
        example: 6
        in: query
        name: sesiones
        type: integer
      - description: Filtrar por servicios que requieren evaluacion
        example: true
        in: query
        name: requiere_evaluacion
        type: boolean
      - description: Filtrar solo servicios visibles para pacientes nuevos
        example: true
        in: query
        name: paciente_nuevo
        type: boolean
      - description: activos (default), inactivos o todos; un servicio dado de baja
          se reactiva con PATCH activo=true
        enum:
        - activos
        - inactivos
        - todos
        example: inactivos
        in: query
        name: estado
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.servicioListResponse'
              type: object
        "400":
          description: 'Error de validacion: sesiones debe ser entero positivo, requiere_evaluacion
            debe ser true/false, estado invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Listar servicios desde base de datos
      tags:
      - Servicios BD
    post:
      consumes:
      - application/json
      description: |-
        costo_variable es opcional y default false. Si es true, costo se normaliza a cero. El costo recibido debe ser finito, no negativo y no superar 99999999.99; se redondea a dos decimales. Se conserva costo opcional para consumidores anteriores.
        Crea un servicio en PostgreSQL y opcionalmente lo asocia a un local. Si se envia local, la categoria del servicio debe estar asociada a ese local en categorias_locales. Body: nombre (requerido), categoria (requerido), tiempo HH:MM (opcional), costo (opcional), sesiones entero positivo default 1 (opcional), tipo_espacio_requerido M/B (opcional), requiere_evaluacion true/false default true (opcional), local para activar (opcional). Response: id (int ID del servicio creado).
      parameters:
      - description: Datos del servicio
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.crearServicioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.idResponse'
              type: object
        "400":
          description: 'Error de validacion: nombre/categoria requerido, costo invalido,
            tipo_espacio_requerido invalido, local no encontrado, categoria no disponible
            para el local, local sin espacios'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Crear servicio
      tags:
      - Servicios BD
  /bd/servicios/{id}:
    delete:
      description: 'Realiza borrado logico de un servicio (activo=false). Param: id
        (requerido, path). Response: mensaje string.'
      parameters:
      - description: ID del servicio
        example: 8
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
