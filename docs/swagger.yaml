basePath: /
definitions:
  handlers.activarServicioRequest:
    properties:
      local:
        description: Nombre del local donde activar el servicio
        example: PASEO ARANJUEZ
        type: string
    required:
    - local
    type: object
  handlers.actualizadasResponse:
    properties:
      actualizadas:
        description: Cantidad de registros actualizados
        example: 3
        type: integer
    type: object
  handlers.actualizarCategoriaRequest:
    properties:
      nombre:
        description: Nuevo nombre de la categoria
        example: Depilacion Laser
        type: string
    required:
    - nombre
    type: object
  handlers.actualizarClienteRequest:
    properties:
      apellido:
        description: Nuevo apellido (opcional)
        example: Lopez Aguilar
        type: string
      nombre:
        description: Nuevo nombre (opcional)
        example: Maria Fernanda
        type: string
      numero_telefono:
        description: Nuevo numero de telefono (opcional)
        example: "+59170011224"
        type: string
    type: object
  handlers.actualizarComboCatalogoRequest:
    properties:
      categoria_id:
        description: Nueva categoria opcional.
        example: 3
        type: integer
      descripcion:
        description: Nueva descripcion opcional; una cadena vacia la limpia.
        example: Masaje y drenaje personalizado
        type: string
      duracion_min:
        description: Nueva duracion sugerida por sesion en minutos.
        example: 90
        type: integer
      moneda:
        description: Nueva moneda ISO de tres letras.
        example: BOB
        type: string
      nombre:
        description: Nuevo nombre comercial opcional.
        example: Combo Relax Premium
        type: string
      precio_paquete:
        description: Nuevo precio final de paquete cuando corresponda.
        example: 750
        type: number
      tipo_precio:
        description: 'Nueva regla de precio opcional: POR_ITEMS o PRECIO_PAQUETE.'
        example: POR_ITEMS
        type: string
    type: object
  handlers.actualizarDetallePagoRequest:
    properties:
      cantidad:
        description: Cantidad para un detalle nuevo.
        example: 2
        type: integer
      id:
        description: ID del detalle existente que debe conservarse.
        example: 25
        type: integer
      precio_unitario:
        description: Precio unitario para un detalle nuevo.
        example: 250
        type: number
      servicio:
        description: Texto del servicio para un detalle nuevo.
        example: Limpieza facial
        type: string
      servicio_id:
        description: ID opcional del servicio para un detalle nuevo.
        example: 8
        type: integer
      subtotal:
        description: Subtotal para un detalle nuevo.
        example: 500
        type: number
    type: object
  handlers.actualizarEstadoReservaPGRequest:
    properties:
      causa:
        description: Motivo del cambio de estado
        example: Cliente confirmo por WhatsApp
        type: string
      estado:
        description: 'Nuevo estado: PENDIENTE, AGENDADO, RECHAZADO o COMPLETADO'
        example: AGENDADO
        type: string
      id:
        description: ID de la reserva
        example: 44
        type: integer
      precio:
        description: Precio actualizado (opcional)
        example: 350
        type: number
      servicio_confirmado:
        description: Servicio confirmado (opcional, se actualiza si se envia)
        example: Depilacion Laser Piernas
        type: string
      tipo:
        description: 'Tipo de espacio: M (mesa) o B (bicicleta)'
        example: M
        type: string
    required:
    - estado
    - id
    type: object
  handlers.actualizarLocalHorarioRequest:
    properties:
      dia_semana:
        description: Día de la semana 1-7 (opcional)
        example: 6
        type: integer
      hora_desde:
        description: Hora de inicio HH:MM (opcional)
        example: "10:00"
        type: string
      hora_hasta:
        description: Hora de fin HH:MM (opcional)
        example: "16:00"
        type: string
    type: object
  handlers.actualizarLocalRequest:
    properties:
      activo:
        description: Estado activo/inactivo (opcional)
        example: true
        type: boolean
      nombre:
        description: Nuevo nombre del local (opcional)
        example: PASEO ARANJUEZ
        type: string
    type: object
  handlers.actualizarNotificadoReservaPGRequest:
    properties:
      id:
        description: ID de la reserva
        example: 44
        type: integer
      notificado:
        description: 'Estado de notificacion: true = notificado, false = no notificado'
        example: true
        type: boolean
    required:
    - id
    - notificado
    type: object
  handlers.actualizarPagoRequest:
    properties:
      activo:
        description: Nuevo estado activo (opcional).
        example: true
        type: boolean
      cliente_id:
        description: Nuevo ID del cliente; puede enviarse null para limpiar la referencia.
        example: 12
        type: integer
      cliente_nit:
        description: Nuevo NIT del cliente; puede enviarse null o vacio para limpiar
          el valor.
        example: "1234567"
        type: string
      cliente_nombre:
        description: Nuevo nombre del cliente (opcional).
        example: Maria Lopez
        type: string
      descuento:
        description: Nuevo descuento del pago (opcional).
        example: 50
        type: number
      detalle:
        description: Detalle completo deseado para sincronizar; ids presentes se conservan,
          ids ausentes se eliminan y items sin id se crean.
        items:
          $ref: '#/definitions/handlers.actualizarDetallePagoRequest'
        type: array
      estado:
        description: Nuevo estado del pago (opcional).
        example: PAGADO
        type: string
      local_id:
        description: Nuevo ID del local (opcional).
        example: 1
        type: integer
      local_nombre:
        description: Nuevo nombre del local (opcional).
        example: SAN MARTIN
        type: string
      nombre:
        description: Nombre completo del cajero actual; si se omite o viene vacio
          se usa el username del token.
        example: Ana Perez
        type: string
      subtotal:
        description: Nuevo subtotal del pago (opcional).
        example: 500
        type: number
      tipo_pago:
        description: 'Nuevo tipo de pago (opcional): efectivo o qr.'
        example: qr
        type: string
      total_final:
        description: Nuevo total final del pago (opcional).
        example: 450
        type: number
    type: object
  handlers.actualizarPlanRequest:
    properties:
      fecha_fin:
        example: "2026-08-19"
        type: string
      fecha_inicio:
        example: "2026-07-20"
        type: string
      notas:
        example: Actualizar notas del plan
        type: string
    type: object
  handlers.actualizarReservaPGRequest:
    properties:
      id:
        description: ID de la reserva a actualizar
        example: 44
        type: integer
      local:
        description: Nombre del local (siempre requerido para validar existencia)
        example: SAN MARTIN
        type: string
      nueva_fecha:
        description: Nueva fecha (YYYY-MM-DD), opcional
        example: "2026-05-24"
        type: string
      nueva_hora_desde:
        description: Nueva hora de inicio (HH:MM), opcional
        example: "16:00"
        type: string
      nueva_hora_hasta:
        description: Nueva hora de fin (HH:MM), opcional
        example: "17:00"
        type: string
      nuevas_notas:
        description: Nuevas notas u observaciones, opcional
        example: Reagendada por solicitud del cliente
        type: string
      nuevo_numero_telefono:
        description: Nuevo numero de telefono, opcional
        example: "+59170011224"
        type: string
      nuevo_precio:
        description: Nuevo precio, opcional
        example: 180
        type: number
      nuevo_servicio:
        description: Nuevo nombre del servicio principal (opcional)
        example: Evaluacion corporal
        type: string
      nuevo_servicio_confirmado:
        description: Nuevo servicio confirmado tras evaluacion (opcional)
        example: Evaluacion corporal
        type: string
      nuevo_servicio_solicitado:
        description: Nuevo detalle de lo que solicito el cliente (opcional)
        example: Evaluacion corporal completa
        type: string
      nuevo_tipo:
        description: 'Nuevo tipo de espacio: M (mesa) o B (bicicleta), opcional'
        example: B
        type: string
    required:
    - id
    - local
    type: object
  handlers.actualizarReservaRequest:
    properties:
      cliente:
        description: Nombre del cliente
        example: Maria Lopez
        type: string
      dia:
        description: Dia actual de la reserva
        example: lunes
        type: string
      hora:
        description: Hora actual de la reserva
        example: "09:00"
        type: string
      local:
        description: Nombre del local
        example: SAN MARTIN
        type: string
      nueva_hora_desde:
        description: Nueva hora de inicio (opcional)
        example: "11:00"
        type: string
      nueva_hora_hasta:
        description: Nueva hora de fin (opcional)
        example: "12:00"
        type: string
      nuevo_dia:
        description: Nuevo dia (opcional)
        example: martes
        type: string
      nuevo_servicio:
        description: Nuevo nombre del servicio (opcional)
        example: Evaluacion corporal
        type: string
      nuevo_tipo:
        description: 'Nuevo tipo de espacio: M o B (opcional)'
        example: B
        type: string
      semana:
        description: Semana en formato YYYY-MM-DD
        example: "2026-05-25"
        type: string
      tipo:
        description: 'Tipo actual de espacio: M (mesa) o B (bicicleta)'
        example: M
        type: string
    required:
    - cliente
    - dia
    - hora
    - local
    - semana
    - tipo
    type: object
  handlers.actualizarServicioRequest:
    properties:
      activo:
        description: Nuevo estado activo/inactivo (opcional)
        example: true
        type: boolean
      categoria:
        description: Nueva categoría (opcional)
        example: Corporal
        type: string
      costo:
        description: Nuevo costo (opcional)
        example: 420
        type: number
      nombre:
        description: Nuevo nombre (opcional)
        example: Depilacion Laser Piernas Premium
        type: string
      requiere_evaluacion:
        description: Nuevo estado de requiere evaluación (opcional)
        example: false
        type: boolean
      sesiones:
        description: Nueva cantidad de sesiones (opcional)
        example: 8
        type: integer
      tiempo:
        description: Nueva duración HH:MM (opcional)
        example: "01:15"
        type: string
      tipo_espacio_requerido:
        description: Nuevo tipo de espacio requerido M/B (opcional)
        example: M
        type: string
    type: object
  handlers.actualizarUsuarioActivoRequest:
    properties:
      activo:
        description: Estado activo del usuario a modificar.
        example: true
        type: boolean
      username:
        description: Nombre de usuario a activar o desactivar.
        example: operador
        type: string
    required:
    - activo
    - username
    type: object
  handlers.actualizarUsuarioLocalRequest:
    properties:
      local_id:
        description: ID del local activo a asignar al usuario.
        example: 1
        type: integer
      username:
        description: Nombre de usuario a modificar.
        example: operador
        type: string
    required:
    - local_id
    - username
    type: object
  handlers.authRequest:
    properties:
      password:
        description: Password en texto plano enviada por el cliente.
        example: Secreto123
        type: string
      username:
        description: Nombre de usuario para iniciar sesion.
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  handlers.cambiarEstadoPlanRequest:
    properties:
      estado:
        example: ACTIVO
        type: string
    type: object
  handlers.cambiarPasswordRequest:
    properties:
      password:
        description: Nueva password del usuario autenticado.
        example: NuevoSecreto123
        type: string
    required:
    - password
    type: object
  handlers.categoriaListResponse:
    properties:
      categorias:
        description: Lista de categorías
        items:
          $ref: '#/definitions/models.CategoriaPG'
        type: array
      total:
        description: Total de categorías encontradas
        example: 5
        type: integer
    type: object
  handlers.categoriaLocalRequest:
    properties:
      categoria_id:
        description: ID de la categoria a asociar con el local
        example: 3
        type: integer
      local_id:
        description: ID del local a asociar con la categoria
        example: 1
        type: integer
    required:
    - categoria_id
    - local_id
    type: object
  handlers.categoriaLocalesResponse:
    properties:
      locales:
        description: Locales asociados a la categoría
        items:
          $ref: '#/definitions/models.LocalPG'
        type: array
    type: object
  handlers.clienteFiltrosResponse:
    properties:
      apellido:
        description: 'Filtro aplicado: apellido del cliente'
        example: Lopez
        type: string
      nombre:
        description: 'Filtro aplicado: nombre del cliente'
        example: Maria
        type: string
      numero_telefono:
        description: 'Filtro aplicado: número de teléfono del cliente'
        example: "+59170011223"
        type: string
    type: object
  handlers.clienteItemResponse:
    properties:
      cliente:
        allOf:
        - $ref: '#/definitions/models.ClientePG'
        description: Datos del cliente
    type: object
  handlers.clienteListResponse:
    properties:
      clientes:
        description: Lista de clientes
        items:
          $ref: '#/definitions/models.ClientePG'
        type: array
      filtros:
        allOf:
        - $ref: '#/definitions/handlers.clienteFiltrosResponse'
        description: Filtros aplicados en la búsqueda
      total:
        description: Total de clientes encontrados
        example: 1
        type: integer
    type: object
  handlers.comboCatalogoFiltrosResponse:
    properties:
      categoria:
        description: 'Filtro aplicado: categoría parcial del combo.'
        example: Corporal
        type: string
      local:
        description: 'Filtro aplicado: nombre parcial del local.'
        example: SAN MARTIN
        type: string
      local_id:
        description: 'Filtro aplicado: ID exacto del local.'
        example: 1
        type: integer
      nombre:
        description: 'Filtro aplicado: nombre parcial del combo.'
        example: relax
        type: string
    type: object
  handlers.comboCatalogoItemResponse:
    properties:
      combo:
        allOf:
        - $ref: '#/definitions/models.ComboCatalogoPG'
        description: Datos completos de la promocion, incluidos locales y servicios
          snapshot.
    type: object
  handlers.comboCatalogoListResponse:
    properties:
      combos:
        description: Lista de promociones activas del catalogo.
        items:
          $ref: '#/definitions/models.ComboCatalogoPG'
        type: array
      filtros:
        allOf:
        - $ref: '#/definitions/handlers.comboCatalogoFiltrosResponse'
        description: Filtros aplicados en la búsqueda.
      total:
        description: Cantidad total de promociones que coinciden con los filtros aplicados.
        example: 3
        type: integer
    type: object
  handlers.comboServicioCatalogoRequest:
    properties:
      costo:
        description: Precio unitario snapshot de cada sesion.
        example: 250
        type: number
      orden:
        description: Posicion unica de la linea dentro del combo, iniciando en cero.
        example: 0
        type: integer
      servicio_id:
        description: ID opcional del servicio de catalogo usado como origen.
        example: 8
        type: integer
      servicio_texto:
        description: Nombre snapshot manual; si se omite y hay servicio_id, se copia
          del servicio origen.
        example: Masaje relajante personalizado
        type: string
      sesion_numero:
        description: Numero de sesion (1-based) a la que pertenece el servicio.
        example: 1
        type: integer
      sesiones:
        description: Cantidad de sesiones incluidas en esta linea.
        example: 2
        type: integer
      tiempo:
        description: Duracion snapshot del servicio en formato libre, por ejemplo
          HH:MM.
        example: "01:00"
        type: string
    type: object
  handlers.crearCategoriaRequest:
    properties:
      local_id:
        description: ID del local al que se asociara la categoria; si es null u omitido,
          solo crea la categoria
        example: 1
        type: integer
      nombre:
        description: Nombre de la categoria
        example: Depilacion Laser
        type: string
    required:
    - nombre
    type: object
  handlers.crearClienteRequest:
    properties:
      apellido:
        description: Apellido del cliente
        example: Lopez
        type: string
      nombre:
        description: Nombre del cliente
        example: Maria
        type: string
      numero_telefono:
        description: Numero de telefono del cliente
        example: "+59170011223"
        type: string
    type: object
  handlers.crearComboCatalogoRequest:
    properties:
      categoria_id:
        description: ID opcional de la categoria del catalogo.
        example: 3
        type: integer
      descripcion:
        description: Descripcion opcional mostrada en catalogo.
        example: Masaje y drenaje para cuatro sesiones
        type: string
      duracion_min:
        description: Duracion sugerida por sesion en minutos; opcional.
        example: 90
        type: integer
      local_ids:
        description: IDs de los locales activos donde se publica el combo.
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      moneda:
        description: Moneda ISO de tres letras; BOB por defecto.
        example: BOB
        type: string
      nombre:
        description: Nombre comercial de la promocion.
        example: Combo Relax
        type: string
      precio_paquete:
        description: Precio final requerido solo cuando tipo_precio es PRECIO_PAQUETE.
        example: 700
        type: number
      servicios:
        description: Lineas que componen la promocion.
        items:
          $ref: '#/definitions/handlers.comboServicioCatalogoRequest'
        type: array
      tipo_precio:
        description: 'Regla de precio: POR_ITEMS o PRECIO_PAQUETE.'
        example: PRECIO_PAQUETE
        type: string
    type: object
  handlers.crearDetallePagoRequest:
    properties:
      cantidad:
        description: Cantidad cobrada.
        example: 2
        type: integer
      precio_unitario:
        description: Precio unitario del servicio.
        example: 250
        type: number
      servicio:
        description: Texto del servicio cobrado.
        example: Limpieza facial
        type: string
      servicio_id:
        description: ID opcional del servicio cobrado; puede enviarse null.
        example: 8
        type: integer
      subtotal:
        description: Subtotal de la linea.
        example: 500
        type: number
    type: object
  handlers.crearLocalHorarioRequest:
    properties:
      dia_semana:
        description: Día de la semana (1=lunes, 7=domingo)
        example: 1
        type: integer
      hora_desde:
        description: Hora de inicio (HH:MM)
        example: "09:00"
        type: string
      hora_hasta:
        description: Hora de fin (HH:MM)
        example: "18:00"
        type: string
      local_id:
        description: ID del local
        example: 3
        type: integer
    type: object
  handlers.crearLocalRequest:
    properties:
      espacios:
        description: Espacios del local (opcional)
        items:
          $ref: '#/definitions/handlers.espacioRequest'
        type: array
      nombre:
        description: Nombre del local
        example: SAN MARTIN
        type: string
    required:
    - nombre
    type: object
  handlers.crearPagoRequest:
    properties:
      activo:
        description: Estado activo inicial del pago.
        example: true
        type: boolean
      cliente_id:
        description: ID opcional del cliente registrado; puede enviarse null.
        example: 12
        type: integer
      cliente_nit:
        description: NIT opcional del cliente.
        example: "1234567"
        type: string
      cliente_nombre:
        description: Nombre del cliente.
        example: Maria Lopez
        type: string
      descuento:
        description: Descuento aplicado.
        example: 50
        type: number
      detalle:
        description: Detalle de servicios cobrados.
        items:
          $ref: '#/definitions/handlers.crearDetallePagoRequest'
        type: array
      estado:
        description: Estado inicial del pago.
        example: PENDIENTE
        type: string
      local_id:
        description: ID del local donde se registra el pago.
        example: 1
        type: integer
      local_nombre:
        description: Nombre del local donde se registra el pago.
        example: SAN MARTIN
        type: string
      nombre:
        description: Nombre completo del cajero actual; si se omite o viene vacio
          se usa el username del token.
        example: Juan Perez
        type: string
      subtotal:
        description: Subtotal del pago.
        example: 500
        type: number
      tipo_pago:
        description: 'Tipo de pago utilizado: efectivo o qr.'
        example: efectivo
        type: string
      total_final:
        description: Total final del pago.
        example: 450
        type: number
    type: object
  handlers.crearPlanRequest:
    properties:
      cantidad_cuotas:
        example: 3
        type: integer
      cliente_id:
        example: 12
        type: integer
      combo_id:
        example: 12
        type: integer
      descuento:
        example: 50
        type: number
      fecha_fin:
        example: "2026-08-14"
        type: string
      fecha_inicio:
        example: "2026-07-15"
        type: string
      local_id:
        example: 1
        type: integer
      notas:
        example: Pago contado
        type: string
      pago_codigo:
        description: Codigo del pago de caja a aplicar a la cuota (UNICO); marca la
          cuota PAGADO.
        example: PAG-000123
        type: string
      servicios:
        items:
          $ref: '#/definitions/handlers.planServicioManualRequest'
        type: array
      tipo_pago:
        example: UNICO
        type: string
    type: object
  handlers.crearReservaPGRequest:
    properties:
      cliente:
        description: Nombre del cliente
        example: Maria Lopez
        type: string
      estado:
        description: 'Estado inicial: PENDIENTE (default), AGENDADO'
        example: PENDIENTE
        type: string
      fecha:
        description: Fecha de la reserva (YYYY-MM-DD)
        example: "2026-05-23"
        type: string
      hora_desde:
        description: Hora de inicio (HH:MM)
        example: "15:00"
        type: string
      hora_hasta:
        description: Hora de fin (HH:MM)
        example: "16:00"
        type: string
      local:
        description: Nombre del local
        example: SAN MARTIN
        type: string
      notas:
        description: Notas u observaciones
        example: Primera sesion del plan
        type: string
      numero_telefono:
        description: Numero de telefono del cliente
        example: "+59170011223"
        type: string
      plan_id:
        description: ID del plan asociado (opcional)
        example: 21
        type: integer
      precio:
        description: Precio de la reserva
        example: 350
        type: number
      servicio:
        description: 'Nombre del servicio principal (ej: "Depilacion laser"). Se usa
          como identificador general.'
        example: Depilacion laser
        type: string
      servicio_confirmado:
        description: 'Servicio final confirmado tras evaluacion (ej: "Depilacion Laser
          Piernas"). Si se omite y el servicio no requiere evaluacion, se autocompleta
          con el nombre del servicio encontrado en BD.'
        example: Depilacion Laser Piernas
        type: string
      servicio_id:
        description: ID del servicio seleccionado en BD. Si se envia, se usa para
          validar si requiere evaluacion.
        example: 8
        type: integer
      servicio_solicitado:
        description: 'Detalle de lo que solicito el cliente (ej: "Piernas completas").
          Si se omite, se copia de "servicio".'
        example: Piernas completas
        type: string
