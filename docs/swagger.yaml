  /bd/pagos:
    get:
      description: 'Devuelve pagos activos de BD con filtros opcionales. Requiere
        token Bearer. Solo retorna la informacion base del pago, sin detalle. Incluye
        auditoria de creacion y modificacion: fecha_creacion, fecha_modificacion,
        id_cajero, nombre_cajero, username_cajero, id_cajero_modificacion, nombre_cajero_modificacion
        y username_cajero_modificacion. Filtros: codigo_pago busqueda parcial, local_id,
        local_nombre busqueda parcial, cliente_id, cliente_nit busqueda parcial, cliente_nombre
        busqueda parcial, tipo_pago efectivo/qr, estado PAGADO/BORRADOR/PENDIENTE,
        activo true/false, cajero de creacion y cajero de modificacion. Si activo
        no se envia, lista solo pagos activos.'
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Busqueda parcial por codigo de pago
        example: PAGO-000001
        in: query
        name: codigo_pago
        type: string
      - description: ID del local
        example: 1
        in: query
        name: local_id
        type: integer
      - description: Busqueda parcial por nombre del local
        example: SAN MARTIN
        in: query
        name: local_nombre
        type: string
      - description: ID del cliente
        example: 12
        in: query
        name: cliente_id
        type: integer
      - description: Busqueda parcial por NIT del cliente
        example: "1234567"
        in: query
        name: cliente_nit
        type: string
      - description: Busqueda parcial por nombre del cliente
        example: Maria
        in: query
        name: cliente_nombre
        type: string
      - description: Tipo de pago
        enum:
        - efectivo
        - qr
        example: efectivo
        in: query
        name: tipo_pago
        type: string
      - description: Estado del pago
        enum:
        - PAGADO
        - BORRADOR
        - PENDIENTE
        example: PENDIENTE
        in: query
        name: estado
        type: string
      - description: Filtrar por activo; default true
        example: true
        in: query
        name: activo
        type: boolean
      - description: ID del cajero que registro el pago
        example: 1
        in: query
        name: id_cajero
        type: integer
      - description: Busqueda parcial por nombre del cajero que registro el pago
        example: Juan
        in: query
        name: nombre_cajero
        type: string
      - description: Busqueda parcial por username del cajero que registro el pago
        example: juan
        in: query
        name: username_cajero
        type: string
      - description: ID del cajero que modifico el pago por ultima vez
        example: 2
        in: query
        name: id_cajero_modificacion
        type: integer
      - description: Busqueda parcial por nombre del cajero que modifico el pago por
          ultima vez
        example: Ana
        in: query
        name: nombre_cajero_modificacion
        type: string
      - description: Busqueda parcial por username del cajero que modifico el pago
          por ultima vez
        example: ana
        in: query
        name: username_cajero_modificacion
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.pagoListResponse'
              type: object
        "400":
          description: 'Error de validacion: local_id invalido, cliente_id invalido,
            id_cajero invalido, id_cajero_modificacion invalido, activo invalido,
            Tipo de pago invalido. Solo se aceptan pagos en efectivo y QR, estado
            invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token requerido, invalido o expirado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Listar pagos
      tags:
      - Pagos
    post:
      consumes:
      - application/json
      description: 'Crea un pago independiente junto con su detalle en una sola transaccion.
        Requiere token Bearer. Deben venir los campos de cabecera requeridos excepto
        codigo_pago, fecha_creacion, fecha_modificacion y auditoria, que se generan
        desde BD/token. Puede enviarse nombre para guardar el nombre completo del
        cajero; si se omite o viene vacio se usa el username del token. id_cajero
        y username_cajero se toman del token y los campos de auditoria no son editables.
        cliente_id y cliente_nit son opcionales y pueden omitirse o enviarse como
        null. tipo_pago es requerido y solo acepta efectivo o qr. subtotal y total_final
        son opcionales: si no se envian, se calculan desde la suma de subtotales del
        detalle y el descuento. Cada item de detalle debe incluir servicio_id (puede
        ser null), servicio, precio_unitario, cantidad y subtotal. Response: codigo_pago
        generado incrementalmente.'
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Datos completos del pago y su detalle
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.crearPagoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.pagoCreatedResponse'
              type: object
        "400":
          description: 'Error de validacion: body invalido, campos requeridos, importes
            invalidos, nombre del cajero es requerido, campos de auditoria no editables,
            Tipo de pago invalido. Solo se aceptan pagos en efectivo y QR, estado
            invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token requerido, invalido o expirado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: 'Referencia no encontrada: local, cliente o servicio invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Crear pago
      tags:
      - Pagos
  /bd/pagos/{codigo_pago}:
    delete:
      description: Realiza borrado logico de un pago activo por codigo_pago (activo=false).
        Requiere token Bearer. No elimina fisicamente la cabecera ni el detalle.
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Codigo publico del pago
        example: PAGO-000001
        in: path
        name: codigo_pago
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.messageResponse'
              type: object
        "400":
          description: 'Error de validacion: codigo_pago requerido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token requerido, invalido o expirado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Pago no encontrado o ya inactivo
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Eliminar pago
      tags:
      - Pagos
    get:
      description: 'Devuelve un pago activo por codigo_pago junto con su detalle.
        Requiere token Bearer. Los usuarios con local asignado solo pueden consultar
        pagos de su local; admin_sys puede consultar cualquiera. Param: codigo_pago
        (requerido, path). Response: pago (PagoCompletoPG con cabecera, auditoria
        de creacion/modificacion y detalle_pagos).'
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Codigo publico del pago
        example: PAGO-000001
        in: path
        name: codigo_pago
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.pagoItemResponse'
              type: object
        "400":
          description: 'Error de validacion: codigo_pago requerido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token requerido, invalido o expirado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Usuario no autorizado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Pago no encontrado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Obtener pago por codigo
      tags:
      - Pagos
    patch:
      consumes:
      - application/json
      description: 'Actualiza parcialmente la cabecera de un pago activo por codigo_pago
        y puede sincronizar detalle_pagos. Requiere token Bearer. Solo permite modificar
        pagos cuyo estado actual no sea PAGADO. Puede enviarse nombre para guardar
        el nombre completo del cajero que edita; si se omite o viene vacio se usa
        el username del token. id_cajero_modificacion y username_cajero_modificacion
        se toman del token y los campos de auditoria no son editables. tipo_pago es
        opcional, pero si se envia solo acepta efectivo o qr. Si se envia detalle,
        la lista representa el estado final: ids presentes se conservan, ids ausentes
        se eliminan y items sin id se crean. Si se envia detalle y no se envia subtotal
        o total_final, esos campos se recalculan automaticamente desde los subtotales
        del detalle final. cliente_id y cliente_nit pueden enviarse como null para
        limpiar la referencia o el valor.'
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Codigo publico del pago
        example: PAGO-000001
        in: path
        name: codigo_pago
        required: true
        type: string
      - description: Campos base a actualizar y/o detalle a sincronizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.actualizarPagoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.messageResponse'
              type: object
        "400":
          description: 'Error de validacion: codigo_pago requerido, body invalido,
            sin cambios, campos invalidos, nombre del cajero es requerido, campos
            de auditoria no editables, Tipo de pago invalido. Solo se aceptan pagos
            en efectivo y QR, estado invalido'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Token requerido, invalido o expirado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Pago no encontrado
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: 'Conflicto: no se puede modificar un pago en estado PAGADO'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Actualizar pago
      tags:
      - Pagos
  /bd/pagos/resumen:
    get:
      description: 'Devuelve un resumen de ventas basado en pagos activos y PAGADOS
        dentro del periodo. Requiere token Bearer. Query: fecha_desde y fecha_hasta
        son requeridos en formato YYYY-MM-DD; local es opcional y filtra por nombre
        exacto case-insensitive. Si local no se envia, reporte.tipo_reporte es "general"
        y detalle_reportes incluye un reporte por cada local. Si local se envia, reporte.tipo_reporte
        es "Local: <nombre local>" y detalle_reportes viene vacio. Incluye total_periodo,
        subtotal, descuentos, cantidad_pagos, cantidad_servicios_vendidos, ticket_promedio,
        servicio_mas_comprado, servicio_mas_dinero_genera y ventas_por_tipo_pago.'
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Fecha inicial del reporte en formato YYYY-MM-DD
        example: "2026-01-01"
        in: query
        name: fecha_desde
        required: true
        type: string
      - description: Fecha final del reporte en formato YYYY-MM-DD
        example: "2026-01-31"
        in: query
        name: fecha_hasta
        required: true
        type: string
      - description: Nombre exacto del local
