        plan es un contrato adquirido por un cliente; no es un combo de catalogo.
        Requiere token Bearer. Los usuarios no admin_sys solo ven planes de su local
        asignado.
      parameters:
      - default: Bearer <token>
        description: Token Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Busqueda combinada por codigo, cliente, local, combo o estado
        example: Maria
        in: query
        name: busqueda
        type: string
      - description: Busqueda parcial por nombre del cliente
        example: Maria
        in: query
        name: cliente
        type: string
      - description: Busqueda parcial por nombre del local
        example: SAN MARTIN
        in: query
        name: local
        type: string
      - description: ID exacto del local
        example: 1
        in: query
        name: local_id
        type: integer
      - description: 'Filtrar por estado contractual: RESERVADO, ACTIVO, COMPLETADO,
          VENCIDO, CANCELADO'
        example: ACTIVO
        in: query
        name: estado
        type: string
      - description: 'Filtrar por estado de cobranza: PENDIENTE, PARCIAL, PAGADO,
          VENCIDO'
        example: PENDIENTE
        in: query
        name: estado_cobranza
        type: string
      - description: Fecha de creacion desde (YYYY-MM-DD)
        example: "2026-07-01"
        in: query
        name: fecha_desde
        type: string
      - description: Fecha de creacion hasta (YYYY-MM-DD)
        example: "2026-07-31"
        in: query
        name: fecha_hasta
        type: string
      - description: Orden opcional; prioridad_estado ordena RESERVADO, ACTIVO, COMPLETADO,
          VENCIDO y CANCELADO
        enum:
        - prioridad_estado
        in: query
        name: orden
        type: string
      - description: Tamano de pagina opcional (1-100); sin limit ni cursor conserva
          modo legacy
        example: 50
        in: query
        name: limit
        type: integer
      - description: Cursor opaco devuelto en paginacion.next_cursor
        in: query
        name: cursor
        type: string
      - description: Incluye el total de paginas
        example: false
        in: query
        name: include_total
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.planListResponse'
              type: object
        "400":
          description: 'Error de validacion: parametros invalidos'
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
